[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/archive-store",
  "crates/parser",
  "crates/media-store",
  "crates/export",
  "crates/transfer",
  "crates/source-windows",
  "apps/server",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Torben Xiong"]
rust-version = "1.98.1"

[workspace.dependencies]
archive-domain = { path = "crates/domain" }
archive-store = { path = "crates/archive-store" }
message-parser = { path = "crates/parser" }
media-store = { path = "crates/media-store" }
archive-export = { path = "crates/export" }
archive-transfer = { path = "crates/transfer" }
source-windows = { path = "crates/source-windows" }

axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
csv = "=1.4.0"
futures-util = "=0.3.34"
hex = "=0.4.3"
rusqlite = { version = "=0.40.2", features = ["bundled", "chrono", "functions", "serde_json", "uuid", "vtab"] }
libsqlite3-sys = "=0.38.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tower-http = "=0.7.1"
uuid = { version = "=1.26.0", features = ["serde", "v4", "v7"] }
walkdir = "=2.5.0"
windows = "=0.62.2"
zeroize = { version = "=1.9.0", features = ["derive"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[patch.crates-io]
# Keep rusqlite's single SQLite symbol provider, but compile its bundled source
# from the verified SQLite3MultipleCiphers amalgamation recorded under
# third_party/libsqlite3-sys/SQLITE3MC_PROVENANCE.md.
libsqlite3-sys = { path = "third_party/libsqlite3-sys" }
